<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RoBulk marquee</title>
    <!-- 1400x560 marquee promo tile for the Chrome Web Store. -->
    <style>
      html,
      body {
        margin: 0;
        width: 1400px;
        height: 560px;
        overflow: hidden;
      }
      body {
        position: relative;
        background:
          radial-gradient(700px 500px at 100% 100%, rgba(51, 95, 255, 0.6), transparent 70%),
          linear-gradient(160deg, #0b0d16 0%, #10173a 60%, #172a7a 100%);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: #f2f4f5;
      }
      .copy {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 80px;
        width: 470px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 18px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brand img {
        width: 64px;
        height: 64px;
        border-radius: 15px;
      }
      .brand span {
        font-size: 46px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 0;
        font-size: 34px;
        font-weight: 700;
        line-height: 1.2;
      }
      p {
        margin: 0;
        color: #b9c0d6;
        font-size: 18px;
        line-height: 1.5;
      }
      .shot {
        position: absolute;
        top: 70px;
        left: 610px;
        width: 1100px;
        height: 760px;
        transform: scale(0.82);
        transform-origin: top left;
        border-radius: 12px;
        box-shadow:
          0 40px 90px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.06);
        overflow: hidden;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand">
        <img src="../public/icons/icon-128.png" alt="" />
        <span>RoBulk</span>
      </div>
      <h1>Run your Roblox store and games in bulk</h1>
      <p>Price, schedule and put items on sale by the dozen, track what everything earns, and create game passes and developer products from templates.</p>
    </div>
    <div class="shot"><iframe src="../dist-preview/index.html?embed=1&groupId=4861395&tab=earnings" title="RoBulk"></iframe></div>
  </body>
</html>
