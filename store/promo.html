<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RoBulk promo tile</title>
    <!-- 440x280 small promo tile for the Chrome Web Store. -->
    <style>
      html,
      body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
        padding: 0 36px;
        box-sizing: border-box;
        background:
          radial-gradient(320px 220px at 100% 100%, rgba(120, 150, 255, 0.45), transparent 70%),
          linear-gradient(150deg, #1d3fd9 0%, #335fff 55%, #4f78ff 100%);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: #fff;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand img {
        width: 64px;
        height: 64px;
        border-radius: 15px;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35);
      }
      .brand span {
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .tagline {
        margin: 0;
        font-size: 19px;
        font-weight: 600;
        line-height: 1.3;
      }
      .chips {
        display: flex;
        gap: 6px;
      }
      .chips span {
        padding: 3px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        font-size: 12.5px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="../public/icons/icon-128.png" alt="" />
      <span>RoBulk</span>
    </div>
    <p class="tagline">Bulk pricing, sales and earnings<br />for Roblox creators</p>
    <div class="chips"><span>Clothing &amp; UGC</span><span>Game passes</span><span>Earnings</span></div>
  </body>
</html>
