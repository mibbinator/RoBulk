<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RoBulk store screenshot</title>
    <!--
      1280x800 store screenshot: a caption above the real panel running in the
      preview page. Query params: title, sub, q (preview page query string).
    -->
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 800px;
        overflow: hidden;
      }
      body {
        position: relative;
        background:
          radial-gradient(900px 500px at 85% 110%, rgba(51, 95, 255, 0.55), transparent 70%),
          radial-gradient(700px 400px at 0% 0%, rgba(51, 95, 255, 0.18), transparent 70%),
          linear-gradient(165deg, #0b0d16 0%, #0f1530 60%, #142160 100%);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: #f2f4f5;
      }
      header {
        position: absolute;
        top: 46px;
        left: 0;
        right: 0;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 38px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 10px auto 0;
        max-width: 860px;
        color: #b9c0d6;
        font-size: 18px;
        line-height: 1.45;
      }
      .shot {
        position: absolute;
        top: 178px;
        left: 50%;
        width: 1100px;
        height: 760px;
        transform: translateX(-50%) scale(0.8);
        transform-origin: top center;
        border-radius: 12px;
        box-shadow:
          0 40px 90px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.06);
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 12px;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title"></h1>
      <p id="sub"></p>
    </header>
    <div class="shot"><iframe id="frame" title="RoBulk"></iframe></div>
    <script>
      const params = new URLSearchParams(location.search);
      document.getElementById("title").textContent = params.get("title") || "";
      document.getElementById("sub").textContent = params.get("sub") || "";
      document.getElementById("frame").src = `../dist-preview/index.html?embed=1&${params.get("q") || ""}`;
    </script>
  </body>
</html>
